<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        font-size: 48px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
        font-size: 20px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        fill: #38bdf8;
        font-size: 14px;
        letter-spacing: 1.5px;
      }
      .animated-bg-element {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .pulse-element {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: flowDash 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.08">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V320 M200 0V320 M300 0V320 M400 0V320 M500 0V320 M600 0V320 M700 0V320 M800 0V320 M900 0V320 M1000 0V320 M1100 0V320" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic / Graphic Elements in Background & Right Side -->
  <g class="animated-bg-element">
    <!-- Glowing Orbs in Background -->
    <circle cx="950" cy="160" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-element"/>
    <circle cx="1050" cy="100" r="90" fill="#a855f7" opacity="0.15" filter="url(#glow)" class="pulse-element"/>

    <!-- Migration Flow Visualization (Right Side) -->
    <!-- Source DB Icon -->
    <g transform="translate(820, 110)">
      <rect x="0" y="0" width="80" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="40" cy="25" rx="30" ry="12" fill="#334155" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M10 25 V 50 C 10 60, 70 60, 70 50 V 25" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M10 50 V 75 C 10 85, 70 85, 70 75 V 50" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="40" y="93" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">SOURCE</text>
    </g>

    <!-- Animated Data Flow Lines -->
    <path d="M910 160 Q 960 120 1010 160" fill="none" stroke="url(#accentGrad)" stroke-width="3" class="flow-line"/>
    <path d="M910 170 Q 960 210 1010 170" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line"/>

    <!-- Target DB Icon -->
    <g transform="translate(1020, 110)">
      <rect x="0" y="0" width="80" height="100" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
      <ellipse cx="40" cy="25" rx="30" ry="12" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5"/>
      <path d="M10 25 V 50 C 10 60, 70 60, 70 50 V 25" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <path d="M10 50 V 75 C 10 85, 70 85, 70 75 V 50" fill="none" stroke="#c084fc" stroke-width="1.5"/>
      <text x="40" y="93" font-family="sans-serif" font-size="10" fill="#c084fc" font-weight="bold" text-anchor="middle">TARGET</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle Area (Left-aligned, crisp, high contrast) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="115" y="19" class="badge-text" text-anchor="middle">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">
      Awesome Database Migration 🚀
    </text>

    <!-- Gradient Sub-bar under Title -->
    <rect x="0" y="162" width="620" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="0" y="202" class="subtitle-text">
      Top SaaS Platforms, Open-Source Tools &amp; CDC Engines
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#334155" opacity="0.8"/>
      <text x="45" y="17" font-family="sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">⚡ CDC</text>

      <rect x="100" y="0" width="130" height="26" rx="6" fill="#334155" opacity="0.8"/>
      <text x="165" y="17" font-family="sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">🔄 Replication</text>

      <rect x="240" y="0" width="130" height="26" rx="6" fill="#334155" opacity="0.8"/>
      <text x="305" y="17" font-family="sans-serif" font-size="12" fill="#f8fafc" text-anchor="middle">🛠️ Schema Migration</text>
    </g>
  </g>
</svg>
